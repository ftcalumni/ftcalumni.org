<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.title %}
  <title>{{ page.title }} | FTC Alumni</title>
  {% else %}
  <title>FTC Alumni | {{ site.title }}</title>
  {% endif %}

  {% seo title=false %}

  {% assign timestamp = site.time | date: "%s" %}
  <link rel="stylesheet" href="{{ '/assets/style.css?t=' | append: timestamp | relative_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% for item in page.head %}
    {{ item }}
  {% endfor %}
</head>
