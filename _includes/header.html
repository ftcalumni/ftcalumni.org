<header class="clearfix">
  <nav class="right-lg absolute-lg right-0 top-0">
    <ul class="mt-1 mt-lg-2 mr-2 mr-lg-3">
      {% for nav_item in site.data.navigation %}
        {% if nav_item.title %}
        <li class="inline-block block-lg text-right ml-1 ml-lg-0">
          <a class="italic {% if nav_item.url == page.url %}bold{% endif %} no-underline h4" href="{{ nav_item.url | relative_url }}">
            {{ nav_item.title }}
          </a>
        </li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
</header>
