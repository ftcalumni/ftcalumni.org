<div class="mb-2 clearfix header-text">
  <h1 class="h0 inline-block py-2 mt-4 header-title">{{ page.title | default: site.title }}</h1>
  <div class="clearfix mb-4 py-1">
    {% if page.date and page.description == nil %}
    <p class="h4 lh-condensed"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time></p>
    {% elsif page.description or page.title == nil %}
    <p class="h4 lh-condensed">{{ page.description | default: site.description }}</p>
    {% endif %}
    <div class="col-1 sm-width-full border-top-thick"></div>
  </div>
</div>
