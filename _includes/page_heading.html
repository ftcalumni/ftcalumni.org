<div class="mb-2 clearfix header-text">
  <h1 class="h0 inline-block py-2 mt-4 header-title">{{ include.title | default: page.title }}</h1>
  <div class="clearfix mb-4 py-1">
    {% if include.content %}
    <p class="h4 lh-condensed">{{ include.content }}</p>
    {% endif %}
    <div class="col-1 sm-width-full border-top-thick"></div>
  </div>
</div>
