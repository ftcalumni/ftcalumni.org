title: Federal Trade Commission Alumni Association
email: info@ftcalumni.org
description: >- # this means to ignore newlines until "baseurl:"
  The Federal Trade Commission Alumni Association is an organization of former
  employees of the Federal Trade Commission.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.ftcalumni.org" # the base hostname & protocol for your site
github_username: ftcalumni

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

compress_html:
  comments: ["<!-- ", " -->"]
  clippings: all

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  # - .sass-cache/
  # - .jekyll-cache/
  # - gemfiles/
  # - Gemfile
  # - Gemfile.lock
  # - node_modules/
  # - vendor/bundle/
  # - vendor/cache/
  # - vendor/gems/
  # - vendor/ruby/
  - .bundle/
  - README.md
  - LICENSE
  - .gitignore
  - CNAME
